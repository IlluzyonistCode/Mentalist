{% extends "layout.html" %}

{% block title %}Модуль: {{ module_name }}{% endblock %}

{% block content %}
    <h2>Модуль: {{ module_name }}</h2>
    <div class="module-detail-card">
        <p>Статус: <span id="module-status">{{ module_info.status }}</span></p>
        <div class="console-output">
            <h3>Вывод консоли:</h3>
            <pre id="console-output-content">{{ module_info.output }}</pre>
        </div>
        <div class="console-input">
            <h3>Ввод команды:</h3>
            <input type="text" id="module-input" placeholder="Введите команду...">
            <button id="send-input-btn">Отправить</button>
        </div>
    </div>
{% endblock %}

{% block scripts_extra %}
<script>
    const moduleName = "{{ module_name }}";
    const consoleOutput = document.getElementById('console-output-content');
    const moduleStatus = document.getElementById('module-status');
    const moduleInput = document.getElementById('module-input');
    const sendInputBtn = document.getElementById('send-input-btn');

    function fetchModuleStatus() {
        fetch(`/api/status/${moduleName}`)
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    moduleStatus.textContent = data.status;
                    // Append new output, or replace if too large
                    if (data.output) {
                        const currentScrollHeight = consoleOutput.scrollHeight;
                        const scrollFromBottom = consoleOutput.scrollHeight - consoleOutput.scrollTop - consoleOutput.clientHeight;
                        consoleOutput.textContent = data.output;
                        if (scrollFromBottom < 20) { // If user was near the bottom, scroll to new bottom
                            consoleOutput.scrollTop = consoleOutput.scrollHeight;
                        }
                    }
                } else {
                    console.error('Error fetching status:', data.message);
                }
            })
            .catch(error => console.error('Error fetching module status:', error));
    }

    sendInputBtn.addEventListener('click', function() {
        const command = moduleInput.value;
        if (command) {
            fetch(`/api/send_input/${moduleName}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ command: command })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    moduleInput.value = ''; // Clear input
                    fetchModuleStatus(); // Refresh output immediately
                } else {
                    alert(`Ошибка при отправке команды: ${data.message}`);
                }
            })
            .catch(error => console.error('Error sending input:', error));
        }
    });
    
    // Auto-refresh status every few seconds
    setInterval(fetchModuleStatus, 2000);
    fetchModuleStatus(); // Initial fetch
</script>
{% endblock %}
